<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Detection</title>
</head>

<body>
  <h1>Face Detection</h1>
  <canvas id="canvasOutput" width="640" height="480"></canvas>
  <video id="video" width="640" height="480" autoplay></video>
  <script src="https://docs.opencv.org/4.5.4/opencv.js"></script>
  <script>
    // Очікуємо завантаження OpenCV.js
    cv.onRuntimeInitialized = () => {
      // Отримуємо доступ до відео з веб-камери
      const video = document.getElementById('video');
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          video.play();
        })
        .catch(error => {
          console.error('Error accessing the camera:', error);
        });

      // Функція для виявлення облич
      const detectFaces = () => {
        const src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
        const dst = new cv.Mat();
        const gray = new cv.Mat();
        const faces = new cv.RectVector();

        // Зчитуємо кадр з відеопотоку
        video.addEventListener('loadeddata', () => {
          const context = canvas.getContext('2d');
          context.drawImage(video, 0, 0, video.width, video.height);
          src.data.set(context.getImageData(0, 0, video.width, video.height).data);

          // Перетворюємо кадр у відтінки сірого
          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

          // Виявлення облич
          const faceCascade = new cv.CascadeClassifier();
          
          faceCascade.load('haarcascade_frontalface_default.xml');
          faceCascade.detectMultiScale(gray, faces);

          // Малюємо прямокутники навколо облич
          for (let i = 0; i < faces.size(); i++) {
            const face = faces.get(i);
            const point1 = new cv.Point(face.x, face.y);
            const point2 = new cv.Point(face.x + face.width, face.y + face.height);
            cv.rectangle(src, point1, point2, [255, 0, 0, 255]);
          }

          // Показуємо обличчя на відеопотоці
          cv.imshow('canvasOutput', src);
          src.delete(); dst.delete(); gray.delete(); faces.delete();
          requestAnimationFrame(detectFaces);
        });
      };
      detectFaces();
    };
  </script>
</body>

</html>
