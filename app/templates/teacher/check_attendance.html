{% extends "teacher_base.html" %}

{% block title %}Відвідування{% endblock %}

{% block content %}
<div class="card card-soft">
    <div class="card-body">
        <h2 class="h5 mb-3">Оберіть групу</h2>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>ID групи</th>
                        <th>Назва групи</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                {% for class in classes_info %}
                    <tr>
                        <td>{{ class[0] }}</td>
                        <td>{{ class[1] }}</td>
                        <td>
                            <a href="{{ url_for('teacher.check_attendance_detailed', id=class[0]) }}" class="btn btn-sm btn-secondary"><i class="bi bi-arrow-right-circle"></i> Обрати</a>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
