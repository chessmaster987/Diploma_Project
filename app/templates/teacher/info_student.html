{% extends "teacher_base.html" %}

{% block title %}Students{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-4 mb-4">
        <div class="card card-soft fade-in">
            <div class="card-body">
                <h2 class="h5 mb-3">Add Student</h2>
                <form action="{{ url_for('teacher.add_student') }}" method="post">
                    <input class="form-control mb-2" name="login" placeholder="Username" required>
                    <input class="form-control mb-2" name="password" placeholder="Password" required>
                    <input class="form-control mb-3" name="student_role" value="student" readonly>
                    <button class="btn btn-primary btn-block">Save</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="card card-soft fade-in">
            <div class="card-body">
                <h2 class="h5 mb-3">Student List</h2>
                <div class="table-responsive">
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Password</th>
                                <th>Role</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                        {% for student in student_data %}
                            <tr>
                                <td>{{ student[0] }}</td>
                                <td>{{ student[1] }}</td>
                                <td>{{ student[2] }}</td>
                                <td>{{ student[3] }}</td>
                                <td class="text-nowrap">
                                    <a href="{{ url_for('teacher.student_detailed', id=student[1]) }}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i> Details</a>
                                    <a href="{{ url_for('teacher.delete_student', id=student[1]) }}" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i> Delete</a>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
