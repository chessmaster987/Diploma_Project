{% extends "teacher_base.html" %}

{% block title %}Дані студента{% endblock %}

{% block content %}
<div class="card card-soft">
    <div class="card-body">
        <h2 class="h5 mb-3">Детальна інформація</h2>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>Логін</th>
                        <th>ПІБ</th>
                        <th>Група</th>
                        <th>Курс</th>
                    </tr>
                </thead>
                <tbody>
                {% for student in student_detailed %}
                    <tr>
                        <td>{{ student[0] }}</td>
                        <td>{{ student[1] }}</td>
                        <td>{{ student[2] }}</td>
                        <td>{{ student[3] }}</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
