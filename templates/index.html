<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flask App</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-image: url('static/2.png'); 
      background-size: cover; 
      background-position: center; 
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #f5e104;
      color: #2016d8f3;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #cf25a7;
    }
  </style>
</head>

<body>
  <button>ПРОЙТИ РЕЄСТРАЦІЮ</button>
  <button>Зареєструвати нового користувача</button>
  <button>Звіт по відвідуванням</button>
</body>

</html>
