<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEACHER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
        body {
            text-align: center;
        }
    
        .container {
            margin-top: 50px;
        }
    
        .info-box {
            text-align: left;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{{url_for('teacher')}}">Головна</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo02"
            aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
            <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
                <li class="nav-item">
                <a class="nav-link" href="{{url_for('info_student')}}">Інформація про учнів</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="{{url_for('info_classes')}}">Управління групами</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="{{ url_for('check_attendance') }}">Перегляд відвідувань студентів</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="{{ url_for('attendance_statistics') }}">Перегляд статистики відвідувань</a>
                </li>
            </ul>
            <form class="form-inline my-2 my-lg-0" method="post" action="/logout">
                <button class="btn btn-outline-success my-2 my-sm-0" type="submit" formaction="/logout">Logout</button>
            </form>
        </div>
    </nav>

    <div class="class">
        <h3>Інформація про групи</h3>
    </div>
    <div class="class">
        <div class="col-md-4">
        <div class="card card-body">
            <form action="{{url_for('add_class')}}" method="POST">
                <div class="form-group">
                    <input type="text" class="form-control" name="class_name" placeholder="Назва групи" required>
                </div>
                <button class="btn btn-primary btn-block">
                    Зберегти
                </button>
            </form>
        </div>
        </div>
        <div class="col-md-8">
        <table id="example" class="table table-striped table-bordered" style="width:100%">
            <thead>
                <tr>
                    <td>ID Групи</td>
                    <td>Назва групи</td>
                </tr>
            </thead>
            <tbody>
                {% for classes in classes_data %}
                <tr>
                    <td>{{ classes[0] }}</td>
                    <td>{{ classes[1] }}</td>
                    <td width="130">
                        <a href="/edit_class/{{classes[0]}}" class="btn btn-secondary btn-sm">змінити</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        </div>
    </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>

</html>
