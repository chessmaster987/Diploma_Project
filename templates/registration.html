<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin-top: 50px;
    }

    form {
      max-width: 400px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    #video {
      width: 100%;
    }

    button[type="button"] {
      background-color: #007bff;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin: 0 auto;
    }

    button[type="button"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <h1>Форма реєстрації</h1>
  <form id="registrationForm">
    <label for="surname">ПІБ:</label><br>
    <input type="text" id="surname" name="surname"><br><br>
    <label for="name">Ім'я для ідентифікації:</label><br>
    <input type="text" id="name" name="name"><br><br>
    <label for="photo">Фото:</label><br>
    <video id="video" autoplay playsinline></video><br><br>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
    <button type="button" onclick="capturePhoto()">Зареєструватися</button>
  </form>

  <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var context = canvas.getContext('2d');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({
        video: true
      }).then(function (stream) {
        video.srcObject = stream;
        video.play();
      });
    }

    function capturePhoto() {
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      var photo = canvas.toDataURL('image/jpeg');
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/save_photo', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          alert('Photo saved successfully');
        }
      };
      xhr.send(JSON.stringify({
        photo_data: photo
      }));
    }
  </script>
</body>

</html>
