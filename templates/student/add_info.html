<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>STUDENT</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
   <style>
      body {
         text-align: center;
      }
   
      .container {
         margin-top: 50px;
      }
   
      .info-box {
         text-align: left;
         padding: 20px;
         border: 1px solid #ccc;
         border-radius: 5px;
         margin-bottom: 20px;
      }
   </style>
</head>

<body>
   <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="{{url_for('student')}}">Головна</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo02"
         aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
         <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
         <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
            <li class="nav-item">
               <a class="nav-link" href="{{url_for('add_info')}}">Внести інформацію про себе</a>
            </li>
            <li class="nav-item">
               <a class="nav-link" href="{{url_for('registration')}}">Додати своє фото</a>
            </li>
            <li class="nav-item">
               <a class="nav-link" href="{{url_for('verify_registration')}}">Зареєструвати відвідування</a>
            </li>
            <li class="nav-item">
               <a class="nav-link" href="{{url_for('attendance_history')}}">Архів відвідувань</a>
            </li>
         </ul>
         <form class="form-inline my-2 my-lg-0" method="post" action="/logout">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit" formaction="/logout">Logout</button>
         </form>
      </div>
   </nav>

    <div class="container mt-4">
    <h2>Додати інформацію про студента</h2>
    <form action="{{ url_for('add_info') }}" method="POST">
        <div class="form-group">
            <label for="fio">ПІБ</label>
            <input type="text" class="form-control" id="fio" name="fio" required>
        </div>
        <div class="form-group">
            <label for="class">Група</label>
            <select class="form-control" name="class" id="class">
               {% for row in class_info %}
                  <option value="{{ row[0] }}">{{ row[1] }}</option>
               {% endfor %}
            </select>   
        </div>
        <div class="form-group">
            <label for="year_of_grade">Курс</label>
            <select class="form-control" name="year_of_grade" id="year_of_grade">
               <option value="1">1</option>
               <option value="2">2</option>
               <option value="3">3</option>
               <option value="4">4</option>
               <option value="5">5</option>
               <option value="6">6</option>  
            </select>   
         </div>
         {% if not is_info_complete %}
            <button type="submit" class="btn btn-primary mt-3">Додати</button>
         {% else %}
            <p>Інформація вже внесена. Ви можете відредагувати її на головному екрані</p>
         {% endif %}
    </form>
    </div>

   <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"></script>
</body>

</html>
