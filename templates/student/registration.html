  <h1>Форма додавання фото</h1>
  <form id="registrationForm">
    <label for="surname">ПІБ:</label>
    <input type="text" id="surname" name="surname" value="{{ full_name }}" readonly>
    <label for="name">Ім'я для ідентифікації:</label>
    <input type="text" id="name" name="name" value="{{ username }}" readonly>
    <label for="photo">Фото:</label>
    <video id="video" autoplay playsinline></video><br><br>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
    <button type="button" onclick="capturePhoto()">Зареєструватися</button>
  </form>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"></script>

  <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var context = canvas.getContext('2d');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({
        video: true
      }).then(function (stream) {
        video.srcObject = stream;
        video.play();
      });
    }

    function capturePhoto() {
      var nameInput = document.getElementById('name');
      var surnameInput = document.getElementById('surname');
      var userName = nameInput.value.trim();
      var surname = surnameInput.value.trim();
      if (userName === "" || surname === "") {
        alert("Будь ласка, введіть і ім'я для ідентифікації, і ПІБ.");
        return;
      }

      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      var photo = canvas.toDataURL('image/jpeg');
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/save_photo', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          alert('Фото збережено успішно');
        }
      };
      xhr.send(JSON.stringify({
        photo_data: photo,
        user_name: userName,
        surname: surname
      }));
    }
  </script>
